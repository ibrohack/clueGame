<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Manrope:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#353535",
                        "secondary-container": "#af8d11",
                        "on-tertiary": "#5d1714",
                        "on-surface-variant": "#c0c9c1",
                        "tertiary-fixed": "#ffdad6",
                        "on-tertiary-fixed-variant": "#7b2d28",
                        "surface-container-low": "#1c1b1b",
                        "secondary-fixed-dim": "#e9c349",
                        "on-tertiary-container": "#eb847b",
                        "on-secondary-fixed-variant": "#574500",
                        "surface-container-high": "#2a2a2a",
                        "inverse-surface": "#e5e2e1",
                        "error": "#ffb4ab",
                        "primary-container": "#06402b",
                        "secondary-fixed": "#ffe088",
                        "on-primary-fixed": "#002114",
                        "secondary": "#e9c349",
                        "on-primary": "#003825",
                        "surface": "#131313",
                        "on-primary-container": "#77ac90",
                        "primary-fixed": "#b8efd0",
                        "inverse-primary": "#356850",
                        "tertiary-container": "#671e1b",
                        "tertiary": "#ffb3ac",
                        "surface-tint": "#9cd2b5",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#241a00",
                        "on-background": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "outline": "#8a938c",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#9cd2b5",
                        "on-tertiary-fixed": "#400204",
                        "surface-container-lowest": "#0e0e0e",
                        "surface-variant": "#353535",
                        "on-surface": "#e5e2e1",
                        "surface-dim": "#131313",
                        "primary": "#9cd2b5",
                        "background": "#131313",
                        "tertiary-fixed-dim": "#ffb3ac",
                        "on-primary-fixed-variant": "#1b503a",
                        "outline-variant": "#404943",
                        "surface-container": "#20201f",
                        "on-secondary-container": "#342800",
                        "on-secondary": "#3c2f00",
                        "surface-bright": "#393939"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "8px",
                        "element-gap": "16px",
                        "container-padding": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Noto Serif"],
                        "headline-xl": ["Noto Serif"],
                        "label-sm": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-md": ["Noto Serif"],
                        "body-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-xl": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .dossier-texture {
            background-image: linear-gradient(to bottom right, rgba(255,255,255,0.02), transparent);
            position: relative;
        }
        .dossier-texture::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
        }
        .inner-glow-primary {
            box-shadow: inset 0 1px 2px rgba(156, 210, 181, 0.3);
        }
        .metallic-border {
            border: 1px solid transparent;
            background: linear-gradient(to bottom, #131313, #131313) padding-box,
                        linear-gradient(135deg, #af8d11, #e9c349, #574500) border-box;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md selection:bg-secondary/30">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline-variant bg-surface/90 backdrop-blur-md shadow-md flex justify-between items-center px-gutter py-base w-full">
<div class="flex items-center">
<h1 class="font-headline-lg text-headline-lg text-secondary dark:text-secondary tracking-tight">CLUE</h1>
</div>
<nav class="absolute left-1/2 -translate-x-1/2 md:flex gap-6 items-center hidden">
<a class="text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer font-label-sm uppercase tracking-widest" href="#">Characters</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer font-label-sm uppercase tracking-widest" href="#">Weapons</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer font-label-sm uppercase tracking-widest" href="#">Locations</a>
</nav>
<div class="flex items-center gap-4">
<a class="text-primary hover:text-secondary transition-colors duration-300 cursor-pointer font-label-sm uppercase tracking-widest" href="#">Login</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-300 cursor-pointer font-label-sm uppercase tracking-widest" href="#">Register</a>
</div>
</header>
<!-- Main Content: Login Screen -->
<main class="min-h-screen flex items-center justify-center pt-24 pb-12 px-gutter relative overflow-hidden">
<!-- Ambient Background Image -->
<!-- The Dossier Card -->
<div class="w-full max-auto max-w-[480px] z-10">
<div class="bg-surface-container-low dossier-texture border border-outline-variant rounded-lg shadow-[0_8px_32px_rgba(0,0,0,0.6)] overflow-hidden">
<!-- Decorative Top Edge (Folder Tab Feel) -->
<div class="h-2 bg-gradient-to-r from-primary-container via-primary to-primary-container"></div>
<div class="px-container-padding py-12">
<!-- Title Section -->
<div class="text-center mb-10">
<span class="text-secondary font-label-sm uppercase tracking-[0.2em] mb-2 block">Acceso Clasificado</span>
<h2 class="font-headline-xl text-headline-xl text-on-surface">Iniciar sesión</h2>
<div class="w-16 h-px bg-secondary/50 mx-auto mt-4"></div>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6">
<!-- User Input -->
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider block">Usuario o Email</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-on-surface-variant/40 rounded px-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary transition-all outline-none shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]" placeholder="Tu usuario o correo electrónico" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="person">person</span>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider block">Contraseña</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface placeholder:text-on-surface-variant/40 rounded px-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary transition-all outline-none shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]" placeholder="Tu contraseña" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant" data-icon="lock">lock</span>
</div>
</div>
<!-- Checkbox & Forgot -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-5 h-5 border border-outline-variant rounded bg-surface-container-lowest checked:bg-primary transition-all cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-on-primary absolute scale-0 peer-checked:scale-100 transition-transform pointer-events-none" data-icon="check" data-weight="fill">check</span>
</div>
<span class="text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
<a class="text-label-sm text-secondary hover:text-primary transition-colors underline decoration-secondary/30 underline-offset-4 uppercase" href="#">¿Olvidaste la clave?</a>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full bg-primary-container text-secondary font-headline-md py-4 rounded-lg border border-secondary inner-glow-primary hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all duration-300 shadow-lg group relative overflow-hidden" type="submit">
<span class="relative z-10">Iniciar sesión</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-10 pt-8 border-t border-outline-variant/30 text-center">
<p class="text-body-md text-on-surface-variant">
                            ¿No tienes cuenta? 
                            <a class="text-secondary font-bold hover:text-primary transition-colors ml-1" href="#">Regístrate</a>
</p>
</div>
</div>
<!-- Footer Image/Branding in Card -->
</div>
<!-- Shadow for the Dossier Card -->
</div>
</main>
<!-- Footer -->
<footer class="w-full py-container-padding bg-surface-container-lowest border-t border-outline-variant flex flex-col md:flex-row justify-between items-center px-gutter gap-element-gap">
<div class="flex flex-col gap-2">
<h2 class="font-headline-md text-headline-md text-secondary">TUDOR ENIGMA</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 1948 Blackwood Estate. All records classified.</p>
</div>
<div class="flex gap-8">
<a class="text-on-surface-variant hover:text-primary underline transition-all font-label-sm uppercase" href="#">Archives</a>
<a class="text-on-surface-variant hover:text-primary underline transition-all font-label-sm uppercase" href="#">The Yard</a>
<a class="text-on-surface-variant hover:text-primary underline transition-all font-label-sm uppercase" href="#">Privacy</a>
<a class="text-on-surface-variant hover:text-primary underline transition-all font-label-sm uppercase" href="#">Encryption</a>
</div>
</footer>
</body></html>
